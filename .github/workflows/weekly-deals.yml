name: Update weekly Publix BOGO deals
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_weekly_deals.py'
      - '.github/workflows/weekly-deals.yml'
      - 'tests/test_weekly_deals.py'
  schedule:
    - cron: '20 12 * * *'
    - cron: '20 20 * * 3,4,5'
  workflow_dispatch:
    inputs:
      ad_url:
        description: 'Optional iHeartPublix weekly ad URL'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: bogo-weekly-catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check BOGO parser against offline sample
        run: python -m unittest discover -s tests -p 'test_weekly_deals.py'
      - name: Extract and validate current and upcoming weekly offers
        env:
          AD_URL: ${{ inputs.ad_url }}
        run: |
          if [ -n "$AD_URL" ]; then
            python scripts/update_weekly_deals.py --url "$AD_URL"
          else
            python scripts/update_weekly_deals.py
          fi
      - name: Publish validated catalog only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- data/deals.json data/next-deals.json data/previous-deals.json || [ -n "$(git ls-files --others --exclude-standard data/next-deals.json data/previous-deals.json)" ]; then
            python scripts/publish_weekly_catalog.py
          else
            echo "No validated catalog change. Keeping existing weeks."
          fi

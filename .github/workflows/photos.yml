name: Enrich BOGO product photos
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/enrich_images.py
      - .github/workflows/photos.yml
  schedule:
    - cron: '30 13 * * 4'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match product images
        run: python scripts/enrich_images.py
      - name: Commit verified matches
        run: |
          if ! git diff --quiet -- data/deals.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/deals.json
            git commit -m "Add matched BOGO product images"
            git push
          fi

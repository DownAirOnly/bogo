name: Automatically match product photos
on:
  workflow_dispatch:
  schedule:
    - cron: '40 15 * * *'
  push:
    paths:
      - scripts/discover_verified_photos.py
      - .github/workflows/verified-photos.yml
permissions:
  contents: write
concurrency:
  group: bogo-verified-photos
  cancel-in-progress: false
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Discover exact photos and review candidates
        run: python scripts/discover_verified_photos.py
      - name: Publish strict matches and candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish_approved_photos.py
          python scripts/publish_candidates.py

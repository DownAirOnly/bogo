name: Deploy bogo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '55 13 * * 3,4'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate app syntax and catalog integrity
        run: |
          node --check app.js
          node tests/test_deal_matching.cjs
          python scripts/validate_catalogs.py
          python -m unittest discover -s tests -p 'test_weekly_deals.py'
      - name: Generate iPhone Home Screen icon
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='icons/icon.svg',write_to='icons/apple-touch-icon.png',output_width=180,output_height=180)
          PY
      - name: Restore previously found product photos
        uses: actions/cache@v4
        with:
          path: images/verified-products
          # One immutable cache per run: newly discovered photos are retained
          # instead of restoring a stale catalog-hash cache forever.
          key: bogo-verified-photos-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bogo-verified-photos-
      # Rescue source: the successful 303-photo build, visually spot-checked.
      # Per-run cache and future searches maintain images as the catalog changes.
      - name: Restore audited product-photo snapshot
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: github-pages
          run-id: 44257170248
          github-token: ${{ github.token }}
          path: /tmp/bogo-photo-backup
      - name: Merge prior product photos without replacing newer matches
        run: python scripts/restore_photo_snapshot.py /tmp/bogo-photo-backup/artifact.tar
      - name: Find and cache product photos automatically
        timeout-minutes: 8
        continue-on-error: true
        run: |
          python -m pip install --quiet pillow
          python -m unittest discover -s tests -p 'test_product_photo_matching.py'
          python scripts/build_product_photos.py
      - name: Stamp deployment build for automatic PWA updates
        env:
          BOGO_BUILD: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          build = os.environ['BOGO_BUILD']
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          assert '__BOGO_BUILD__' in html, 'Missing PWA build placeholder'
          index.write_text(html.replace('__BOGO_BUILD__', build), encoding='utf-8')
          Path('deploy.json').write_text(json.dumps({'build': build}) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

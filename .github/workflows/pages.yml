name: Deploy bogo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '55 13 * * 3,4'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Generate iPhone Home Screen icon
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='icons/icon.svg',write_to='icons/apple-touch-icon.png',output_width=180,output_height=180)
          PY
      - name: Restore previously found product photos
        uses: actions/cache@v4
        with:
          path: images/products
          key: bogo-product-photos-${{ hashFiles('data/deals.json') }}
      - name: Find and cache product photos automatically
        continue-on-error: true
        run: |
          python -m pip install --quiet pillow
          python scripts/build_product_photos.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

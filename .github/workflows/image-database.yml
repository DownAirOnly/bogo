name: Build product photo candidate database
on:
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * 2,5'
  push:
    paths:
      - scripts/build_image_database.py
      - .github/workflows/image-database.yml
permissions:
  contents: write
concurrency:
  group: bogo-image-database
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search for review candidates
        run: python scripts/build_image_database.py
      - name: Save candidate database without conflicting commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish_candidates.py

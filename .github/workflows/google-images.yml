name: Refresh Google Images catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 4'
permissions:
  contents: write
concurrency:
  group: bogo-google-images
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch first Google Images results
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/fetch_google_images.py
      - name: Commit small image index
        run: |
          git add data/google-images.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh Google Images product thumbnails"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
